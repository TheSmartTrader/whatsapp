<!DOCTYPE html>
<!--
  ==========================================================================
  WhatsApp New — group text chat + voice calls for family & friends
  ==========================================================================

  SETUP (takes ~5 minutes, completely free, no credit card):

  1. Go to https://console.firebase.google.com and create a new project
     (name it anything, e.g. "familytalk"). Disable Google Analytics if
     asked — you don't need it.

  2. In the project, click the "</>" (web) icon to add a web app.
     Give it any nickname and click "Register app". Firebase will show
     you a `firebaseConfig` object — copy it.

  3. Paste your copied config into the FIREBASE_CONFIG object below,
     replacing the placeholder values.

  4. In the Firebase console sidebar go to Build → Authentication →
     Get started → Sign-in method → enable "Anonymous".

  5. In the Firebase console sidebar go to Build → Firestore Database →
     Create database → start in PRODUCTION mode → pick any location.
     Then go to the "Rules" tab and paste in the rules from
     firestore.rules.txt (included alongside this file), then Publish.

  6. Open this index.html file in a browser (double-click it) — it
     already works locally. To let family/friends use it from anywhere,
     host it for free: easiest is Firebase Hosting —
        npm install -g firebase-tools
        firebase login
        firebase init hosting   (pick your project, public dir = this folder)
        firebase deploy
     You'll get a free https://your-project.web.app link to share.

  7. Share that link + a "room code" you make up (e.g. "sharma-family")
     with your people. Anyone who opens the link and enters the same
     room code + their name lands in the same chat.

  HOW VOICE CALLS WORK
  Calls are peer-to-peer (WebRTC) using Google's free public STUN
  servers for NAT traversal. This works reliably for 1-on-1 calls on
  most home/mobile networks. Group calls in this version top out at a
  handful of participants at once (each person connects directly to
  every other person) — a large 50-person live call needs a paid media
  server, which is out of scope for a free build.
  ==========================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp New</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b141a" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg: #0b141a;
    --panel: #202c33;
    --panel-2: #202c33;
    --line: #2a3942;
    --text: #e9edef;
    --text-dim: #8696a0;
    --amber: #00a884;
    --amber-dim: #005c4b;
    --teal: #00a884;
    --red: #ef4444;
    --radius: 7.5px;
  }
  html[data-theme="light"]{
    --bg:#f0f2f5;
    --panel:#ffffff;
    --panel-2:#ffffff;
    --line:#e9edef;
    --text:#111b21;
    --text-dim:#667781;
    --amber:#008069;
    --amber-dim:#d9fdd3;
    --teal:#008069;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-weight:600;
    letter-spacing:0;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  input{
    font-family:inherit;
  }
  /* ---------------- Join screen ---------------- */
  #join-screen{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .join-card{
    width:100%;
    max-width:380px;
  }
  .join-card .eyebrow-mark{
    width:36px; height:2px; background:var(--amber); margin-bottom:20px;
  }
  .join-card h1{
    font-size:2.1rem;
    margin:0 0 6px;
    color:var(--text);
  }
  .join-card p.sub{
    color:var(--text-dim);
    margin:0 0 32px;
    font-size:0.95rem;
    line-height:1.5;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:0.78rem;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    border-radius:var(--radius);
    font-size:0.95rem;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--amber); }
  .btn-primary{
    width:100%;
    background:var(--amber);
    color:#0b141a;
    font-weight:600;
    padding:13px 14px;
    border-radius:var(--radius);
    font-size:0.95rem;
    margin-top:6px;
    transition:filter .15s;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  #join-error{
    color:var(--red);
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
  }

  /* ---------------- App shell ---------------- */
  #app{
    display:none;
    height:100dvh;
    grid-template-columns: 260px 1fr;
  }
  #app.active{ display:grid; }
  aside{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    overflow-y:auto;
  }
  .room-title{
    font-size:1.15rem;
    margin:0 0 2px;
  }
  .room-sub{
    color:var(--text-dim);
    font-size:0.78rem;
    margin:0 0 22px;
  }
  .section-label{
    font-size:0.72rem;
    text-transform:uppercase;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin:0 0 10px;
  }
  .member{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 8px;
    border-radius:8px;
    margin-bottom:2px;
  }
  .member .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal);
    flex-shrink:0;
  }
  .member .name{
    flex:1;
    font-size:0.9rem;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .member .call-btn{
    background:transparent;
    color:var(--teal);
    font-size:0.78rem;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid var(--line);
    display:inline-flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
  }
  .member .call-btn:hover{ border-color:var(--teal); }
  .me-tag{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:0.82rem;
    color:var(--text-dim);
  }
  .me-tag b{ color:var(--text); font-weight:500; }

  main{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #messages{
    flex:1;
    overflow-y:auto;
    padding:24px 28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:60%;
    align-self:flex-start;
  }
  .msg.mine{ align-self:flex-end; }
  .msg .who{
    font-size:0.74rem;
    color:var(--text-dim);
    margin-bottom:3px;
    padding:0 4px;
  }
  .msg.mine .who{ text-align:right; }
  .msg .bubble{
    background:var(--panel-2);
    border:none;
    padding:7px 9px 8px;
    border-radius:var(--radius) var(--radius) var(--radius) 0;
    font-size:0.92rem;
    line-height:1.4;
    word-wrap:break-word;
    box-shadow:0 1px 0.5px rgba(11,20,26,.13);
  }
  .msg.mine .bubble{
    background:var(--amber-dim);
    border-radius:var(--radius) var(--radius) 0 var(--radius);
  }
  .msg .time{
    font-size:0.68rem;
    color:var(--text-dim);
    margin-top:3px;
    padding:0 4px;
  }
  .msg.mine .time{ text-align:right; }
  .msg.system{
    align-self:center;
    color:var(--text-dim);
    font-size:0.78rem;
  }
  #composer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:none;
    background:var(--bg);
  }
  #composer input{
    flex:1;
    background:var(--panel);
    border:none;
    color:var(--text);
    padding:12px 16px;
    border-radius:999px;
    font-size:0.94rem;
    outline:none;
  }
  #composer button{
    background:var(--amber);
    color:#0b141a;
    font-weight:700;
    width:42px; height:42px;
    border-radius:50%;
    font-size:0;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #composer button::after{
    content:"➤";
    font-size:1.05rem;
  }
  #photo-btn{
    background:var(--panel);
    color:var(--text-dim);
    border:none;
    width:42px; height:42px;
    border-radius:50%;
    font-size:1.15rem;
    flex-shrink:0;
  }
  #photo-btn:hover{ color:var(--amber); }
  #file-btn{
    background:var(--panel);
    color:var(--text-dim);
    border:none;
    width:42px; height:42px;
    border-radius:50%;
    font-size:1.1rem;
    flex-shrink:0;
  }
  #file-btn:hover{ color:var(--amber); }
  #photo-status{
    padding:0 20px;
    font-size:0.78rem;
    color:var(--text-dim);
    min-height:0;
  }
  .msg .bubble img{
    max-width:260px;
    max-height:260px;
    border-radius:8px;
    display:block;
    cursor:pointer;
  }
  .msg .bubble.image-bubble{
    padding:6px;
    background:var(--panel-2);
  }
  .msg .bubble.audio-bubble{
    padding:8px 10px;
    background:var(--panel-2);
  }
  .msg .bubble.audio-bubble audio{
    width:230px;
    max-width:60vw;
    height:38px;
  }
  .msg .bubble.file-bubble{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    background:var(--panel-2);
    text-decoration:none;
    color:var(--text);
  }
  .file-icon{ font-size:1.6rem; flex-shrink:0; }
  .file-meta{ display:flex; flex-direction:column; min-width:0; }
  .file-name{ font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
  .file-size{ font-size:0.7rem; color:var(--text-dim); }
  .msg .bubble.deleted{
    font-style:italic;
    color:var(--text-dim);
    background:transparent;
    border:1px dashed var(--line);
  }
  .edited-tag{ font-size:0.68rem; color:var(--text-dim); margin-left:4px; }
  .ticks{ display:inline-flex; vertical-align:middle; margin-left:3px; }
  .ticks svg{ width:15px; height:11px; }
  .ticks svg path{ fill:var(--text-dim); }
  .ticks.seen svg path{ fill:#53bdeb; }
  .msg-menu-btn{
    background:transparent; border:none; color:var(--text-dim);
    font-size:0.95rem; padding:0 4px; cursor:pointer; opacity:0.55;
    line-height:1;
  }
  .msg-menu-btn:hover{ opacity:1; }
  .msg .who{ display:flex; align-items:center; gap:4px; }
  .msg.mine .who{ justify-content:flex-end; }
  .reactions{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; padding:0 4px; }
  .msg.mine .reactions{ justify-content:flex-end; }
  .reaction-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:1px 7px; font-size:0.74rem; display:inline-flex; align-items:center;
    gap:3px; cursor:pointer; color:var(--text);
  }
  .reaction-chip.mine-reacted{ border-color:var(--teal); }
  .msg-popover{
    position:fixed; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:8px; box-shadow:0 6px 22px rgba(0,0,0,.4);
    z-index:60; display:flex; flex-direction:column; gap:1px; min-width:170px;
  }
  .msg-popover .emoji-row{ display:flex; gap:5px; padding:4px 3px 9px; border-bottom:1px solid var(--line); margin-bottom:5px; }
  .msg-popover .emoji-row button{ background:transparent; font-size:1.25rem; padding:2px 4px; border-radius:6px; }
  .msg-popover .emoji-row button:hover{ background:var(--line); }
  .msg-popover button.popover-action{
    background:transparent; color:var(--text); text-align:left; padding:9px 10px;
    border-radius:7px; font-size:0.85rem;
  }
  .msg-popover button.popover-action:hover{ background:var(--line); }
  .msg-popover button.popover-action.danger{ color:var(--red); }
  .popover-backdrop{ position:fixed; inset:0; z-index:59; }
  .icon-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    width:36px; height:36px; border-radius:8px; font-size:1rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #pinned-bar{
    display:none; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line);
    gap:8px; overflow-x:auto; align-items:center;
  }
  #pinned-bar.active{ display:flex; }
  .pinned-item{
    flex-shrink:0; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:5px 10px; cursor:pointer; max-width:220px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; color:var(--text-dim); font-size:0.78rem;
  }
  #search-bar{ display:none; padding:8px 16px; gap:8px; background:var(--panel); border-bottom:1px solid var(--line); }
  #search-bar.active{ display:flex; }
  #search-bar input{
    flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:999px; outline:none; font-size:0.88rem;
  }
  #typing-indicator{ padding:0 20px 4px; font-size:0.78rem; color:var(--text-dim); font-style:italic; min-height:0; }
  .msg.search-hidden{ display:none !important; }
  .member .last-seen{ font-size:0.68rem; color:var(--text-dim); margin-left:2px; }
  .member .dot.offline{ background:var(--text-dim); }
  #dm-bar{
    display:flex; align-items:center; gap:8px; padding:6px 16px;
    background:var(--bg);
  }
  #dm-bar #dm-lock{ font-size:0.85rem; opacity:0.6; }
  #dm-target{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:6px 10px; border-radius:999px; font-size:0.8rem; outline:none;
  }
  #dm-bar.active #dm-target{ border-color:var(--teal); color:var(--teal); }
  .private-tag{
    font-size:0.68rem; color:var(--teal); margin-left:2px; font-weight:600;
  }

  /* ---------------- Mic / voice recording ---------------- */
  #mic-btn{
    background:var(--panel);
    color:var(--text-dim);
    border:none;
    width:42px; height:42px;
    border-radius:50%;
    font-size:1.1rem;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  #mic-btn:hover{ color:var(--amber); }
  #mic-btn.recording{
    background:var(--red);
    color:#fff;
    animation:mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(239,68,68,0.45); }
    50%{ box-shadow:0 0 0 8px rgba(239,68,68,0); }
  }
  #recording-indicator{
    display:none;
    align-items:center;
    gap:8px;
    padding:0 20px 6px;
    font-size:0.82rem;
    color:var(--red);
  }
  #recording-indicator.active{ display:flex; }
  #recording-indicator .rec-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--red);
    animation:mic-pulse 1.1s ease-in-out infinite;
  }

  /* ---------------- Mobile header call button ---------------- */
  #mobile-call-btn{
    margin-left:auto;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--teal);
    width:38px; height:38px;
    border-radius:50%;
    font-size:1.05rem;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #desktop-call-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--teal);
    font-size:0.8rem;
    padding:6px 12px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
  }
  #desktop-call-btn:hover{ border-color:var(--teal); }

  /* ---------------- Call overlay ---------------- */
  #call-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(9,11,17,0.92);
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
  }
  #call-overlay.active{ display:flex; }
  .call-avatar{
    width:88px; height:88px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:2rem;
  }
  #call-name{ font-size:1.3rem; }
  #call-status{ color:var(--text-dim); font-size:0.88rem; }
  .call-actions{ display:flex; gap:14px; margin-top:10px; }
  .call-actions button{
    padding:11px 22px;
    border-radius:999px;
    font-size:0.88rem;
    font-weight:600;
  }
  .call-accept{ background:var(--teal); color:#0a1a18; }
  .call-decline, .call-end{ background:var(--red); color:#fff; }

  /* ---------------- Mobile header (menu toggle) ---------------- */
  #mobile-header{
    display:none;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  #menu-toggle{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    width:36px; height:36px;
    border-radius:8px;
    font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #mobile-header .room-title{ font-size:1rem; margin:0; }
  #mobile-header .room-sub{ font-size:0.72rem; margin:0; color:var(--text-dim); }

  #sidebar-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:39;
  }
  #sidebar-backdrop.active{ display:block; }

  @media (max-width: 720px){
    #app.active{ grid-template-columns: 1fr; }
    #mobile-header{ display:flex; }
    aside{
      position:fixed;
      top:0; left:0; bottom:0;
      width:min(78vw, 300px);
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:40;
      display:flex;
    }
    aside.open{ transform:translateX(0); }
    .msg{ max-width:80%; }
    #composer{ gap:6px; padding:8px 10px; }
    #composer input{ padding:11px 14px; }
    #photo-btn, #file-btn, #mic-btn, #composer button[type="submit"]{ width:38px; height:38px; font-size:1rem; }
    #mobile-header{ gap:8px; padding:12px 12px; }
  }
</style>
</head>
<body>

<!-- ===================== JOIN SCREEN ===================== -->
<div id="join-screen">
  <div class="join-card">
    <div class="eyebrow-mark"></div>
    <h1>WhatsApp New</h1>
    <p class="sub">Enter your mobile number once — next time, this device will skip straight to your chat. Room code is what links you to your family/friends.</p>
    <div class="field">
      <label for="phone-input">Mobile number</label>
      <input id="phone-input" type="tel" placeholder="e.g. 9876543210" autocomplete="off" />
    </div>
    <div class="field">
      <label for="room-input">Room code</label>
      <input id="room-input" type="text" placeholder="e.g. sharma-family" autocomplete="off" />
    </div>
    <div class="field">
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="e.g. Aisha" autocomplete="off" />
    </div>
    <button class="btn-primary" id="join-btn">Join room</button>
    <div id="join-error"></div>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app">
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <h2 class="room-title" id="room-title-el">—</h2>
    <p class="room-sub" id="room-count-el">0 online</p>
    <button id="desktop-call-btn" type="button">📞 Call</button>
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="search-toggle-desktop" class="icon-btn" type="button" title="Search messages">🔍</button>
      <button id="theme-toggle-desktop" class="icon-btn" type="button" title="Toggle dark/light">🌙</button>
    </div>
    <p class="section-label">Members</p>
    <div id="member-list"></div>
    <div class="me-tag">You're in as <b id="me-name-el">—</b><br><a href="#" id="switch-account-link" style="color:var(--text-dim); font-size:0.72rem;">Not you? Switch account</a></div>
  </aside>
  <main>
    <div id="mobile-header">
      <button id="menu-toggle" title="Members & calls">☰</button>
      <div>
        <p class="room-title" id="room-title-el-mobile">—</p>
        <p class="room-sub" id="room-count-el-mobile">0 online</p>
      </div>
      <button id="search-toggle-mobile" class="icon-btn" type="button" title="Search">🔍</button>
      <button id="theme-toggle-mobile" class="icon-btn" type="button" title="Theme">🌙</button>
      <button id="mobile-call-btn" type="button" title="Call">📞</button>
    </div>
    <div id="pinned-bar"></div>
    <div id="search-bar">

// -------------------------------------------------------------------------
// Notification sound — short beep via WebAudio, no audio file needed
// -------------------------------------------------------------------------
function playNotifySound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
    osc.onended = () => ctx.close();
  } catch (e) { /* audio not available — ignore */ }
}

async function attemptAutoJoin(){

// -------------------------------------------------------------------------
// Members / presence list
// -------------------------------------------------------------------------
function listenMembers(){
  const q = collection(db, "rooms", roomCode, "members");
  unsubMembers = onSnapshot(q, (snap) => {
    const now = Date.now();
    const list = [];
    snap.forEach((d) => {
      const data = d.data();
      const lastSeenMs = data.lastSeen?.toMillis ? data.lastSeen.toMillis() : now;
      const online = now - lastSeenMs < 45000;
      const typingMs = data.typingAt?.toMillis ? data.typingAt.toMillis() : 0;
      const typing = !!data.typing && (now - typingMs < 4000);
      list.push({ id: d.id, name: data.name, online, lastSeenMs, typing });
    });
    renderMembers(list);
  });
}

let currentOtherMembers = []; // members currently online, excluding me — used by header call buttons

function relativeLastSeen(ms){
  const diffMin = Math.floor((Date.now() - ms) / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return diffMin + "m ago";
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return diffHr + "h ago";
  return Math.floor(diffHr / 24) + "d ago";
}

function renderMembers(list){
  const el = document.getElementById("member-list");
  const onlineCount = list.filter((m) => m.online).length;
  document.getElementById("room-count-el").textContent = onlineCount + " online";
  document.getElementById("room-count-el-mobile").textContent = onlineCount + " online";
  currentOtherMembers = list.filter((m) => m.id !== uid && m.online);

  // sort: online first, then by name
  const sorted = [...list].sort((a, b) => (b.online - a.online) || a.name.localeCompare(b.name));

  el.innerHTML = "";
  sorted.forEach((m) => {
    const row = document.createElement("div");
    row.className = "member";
    const isMe = m.id === uid;
    row.innerHTML = `
      <div class="dot${m.online ? "" : " offline"}"></div>
      <div class="name">${escapeHtml(m.name)}${isMe ? " (you)" : ""}${!m.online ? `<span class="last-seen">last seen ${relativeLastSeen(m.lastSeenMs)}</span>` : ""}</div>
      ${!isMe && m.online ? `<button class="call-btn" data-uid="${m.id}" data-name="${escapeHtml(m.name)}">Call</button>` : ""}
    `;
    el.appendChild(row);
  });
  el.querySelectorAll(".call-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      closeSidebar();
      startCall(btn.dataset.uid, btn.dataset.name);
    });
  });

  const typingNames = list.filter((m) => m.id !== uid && m.typing).map((m) => m.name);
  const typingEl = document.getElementById("typing-indicator");
  if (typingNames.length === 0){
    typingEl.textContent = "";
  } else if (typingNames.length === 1){
    typingEl.textContent = typingNames[0] + " is typing…";
  } else {
    typingEl.textContent = typingNames.join(", ") + " are typing…";
  }

  updateDmTargetOptions(list);
}

function updateDmTargetOptions(list){
  const select = document.getElementById("dm-target");
  const others = list.filter((m) => m.id !== uid).sort((a, b) => a.name.localeCompare(b.name));
  const previousValue = select.value;
  select.innerHTML = `<option value="">Message: Everyone</option>` +
    others.map((m) => `<option value="${m.id}">Message: ${escapeHtml(m.name)}${m.online ? "" : " (offline)"}</option>`).join("");
  if (others.some((m) => m.id === previousValue)) select.value = previousValue;
  document.getElementById("dm-bar").classList.toggle("active", !!select.value);
}

// -------------------------------------------------------------------------
// Text chat
// -------------------------------------------------------------------------
const TICK_SVG = `<svg viewBox="0 0 16 11"><path d="M1 5.5 L5 9.5 L11 1.5" fill="none" stroke-width="1.6" stroke="currentColor"/></svg>`;
const TICK_SVG_DOUBLE = `<svg viewBox="0 0 20 11"><path d="M1 5.5 L5 9.5 L11 1.5" fill="none" stroke-width="1.6" stroke="currentColor"/><path d="M6 5.5 L10 9.5 L19 1" fill="none" stroke-width="1.6" stroke="currentColor"/></svg>`;

function listenMessages(){
  const q = query(collection(db, "rooms", roomCode, "messages"), orderBy("createdAt", "asc"), limit(200));
  unsubMessages = onSnapshot(q, (snap) => {
    // Notification sound for genuinely new incoming messages (skip the initial history load & my own sends)
    if (messagesLoaded){
      snap.docChanges().forEach((change) => {
        if (change.type === "added"){
          const m = change.doc.data();
          const visible = !m.toUid || m.toUid === uid || m.uid === uid;
          if (m.uid !== uid && visible) playNotifySound();
        }
      });
    }

    const el = document.getElementById("messages");
    el.innerHTML = "";
    const pinned = [];
    const seenUpdates = [];

    snap.forEach((d) => {
      const m = d.data();
      const isVisible = !m.toUid || m.toUid === uid || m.uid === uid;
      if (!isVisible) return; // a private DM between two other people — not mine to see

      const mine = m.uid === uid;
      const div = document.createElement("div");
      div.className = "msg" + (mine ? " mine" : "");
      div.id = "msg-" + d.id;
      const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "";

      let privateTag = "";
      if (m.toUid){
        privateTag = mine
          ? `<span class="private-tag">🔒 to ${escapeHtml(m.toName || "")}</span>`
          : `<span class="private-tag">🔒 private</span>`;
      }

      if (m.pinned) pinned.push({ id: d.id, name: m.name, text: m.deleted ? "Deleted message" : (m.text || (m.type === "image" ? "📷 Photo" : m.type === "audio" ? "🎤 Voice message" : m.type === "file" ? "📎 " + (m.fileName || "File") : "")) });

      // Mark messages from others as seen-by-me (skip if already marked)
      if (!mine && !m.deleted && !(m.seenBy || []).includes(uid)){
        seenUpdates.push(d.id);
      }

      let bubbleHtml;
      if (m.deleted){
        bubbleHtml = `<div class="bubble deleted">This message was deleted</div>`;
      } else if (m.type === "image"){
        bubbleHtml = `<div class="bubble image-bubble"><img src="${m.imageData}" alt="Photo from ${escapeHtml(m.name || "someone")}" /></div>`;
      } else if (m.type === "audio"){
        bubbleHtml = `<div class="bubble audio-bubble"><audio controls preload="none" src="${m.audioData}"></audio></div>`;
      } else if (m.type === "file"){
        bubbleHtml = `<a class="bubble file-bubble" href="${m.fileData}" download="${escapeHtml(m.fileName || "file")}"><span class="file-icon">📄</span><span class="file-meta"><span class="file-name">${escapeHtml(m.fileName || "File")}</span><span class="file-size">${formatFileSize(m.fileSize || 0)}</span></span></a>`;
      } else {
        bubbleHtml = `<div class="bubble">${escapeHtml(m.text)}${m.edited ? `<span class="edited-tag">(edited)</span>` : ""}</div>`;
      }

      let ticksHtml = "";
      if (mine && !m.deleted){
        const seenByOthers = (m.seenBy || []).length > 0;
        ticksHtml = `<span class="ticks${seenByOthers ? " seen" : ""}">${seenByOthers ? TICK_SVG_DOUBLE : TICK_SVG}</span>`;
      }

      let reactionsHtml = "";
      if (m.reactions && Object.keys(m.reactions).length > 0){
        const counts = {};
        let myReaction = null;
        Object.entries(m.reactions).forEach(([ruid, emoji]) => {
          counts[emoji] = (counts[emoji] || 0) + 1;
          if (ruid === uid) myReaction = emoji;
        });
        reactionsHtml = `<div class="reactions">${Object.entries(counts).map(([emoji, count]) =>
          `<span class="reaction-chip${emoji === myReaction ? " mine-reacted" : ""}" data-msgid="${d.id}" data-emoji="${emoji}">${emoji} ${count > 1 ? count : ""}</span>`
        ).join("")}</div>`;
      }

      div.innerHTML = `
        <div class="who">
          ${!mine ? escapeHtml(m.name || "Someone") + (m.pinned ? " 📌" : "") : (m.pinned ? "📌 " : "")}
          ${privateTag}
          ${!m.deleted ? `<button class="msg-menu-btn" data-msgid="${d.id}">⋮</button>` : ""}
        </div>
        ${bubbleHtml}
        <div class="time">${time}${ticksHtml}</div>
        ${reactionsHtml}
      `;
      el.appendChild(div);
    });

    el.scrollTop = el.scrollHeight;
    messagesLoaded = true;
    renderPinnedBar(pinned);
    applySearchFilter();

    seenUpdates.forEach((msgId) => {
      updateDoc(doc(db, "rooms", roomCode, "messages", msgId), { seenBy: arrayUnion(uid) }).catch(() => {});
    });

    el.querySelectorAll(".msg-menu-btn").forEach((btn) => {
      btn.addEventListener("click", (ev) => openMessagePopover(ev, btn.dataset.msgid));
    });
    el.querySelectorAll(".reaction-chip").forEach((chip) => {
      chip.addEventListener("click", () => toggleReaction(chip.dataset.msgid, chip.dataset.emoji));
    });
  });
}

function formatFileSize(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

document.getElementById("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  setTypingState(false);
  await addDoc(collection(db, "rooms", roomCode, "messages"), {
    uid, name: myName, text, createdAt: serverTimestamp(), ...dmFields()

});

// Returns { toUid, toName } when a specific member is selected in the
// "Message: …" dropdown, or {} for a normal group message.
function dmFields(){
  const select = document.getElementById("dm-target");
  if (!select.value) return {};
  const label = select.options[select.selectedIndex].textContent.replace(/^Message: /, "").replace(/ \(offline\)$/, "");
  return { toUid: select.value, toName: label };
}

// -------------------------------------------------------------------------
// Typing indicator — writes a lightweight "typing" flag onto my member doc
// -------------------------------------------------------------------------
function setTypingState(typing){
  if (!roomCode) return;
  isTypingNow = typing;
  setDoc(doc(db, "rooms", roomCode, "members", uid), {
    name: myName, lastSeen: serverTimestamp(),
    typing, typingAt: serverTimestamp()
  }, { merge: true }).catch(() => {});
}
document.getElementById("msg-input").addEventListener("input", () => {
  if (!isTypingNow) setTypingState(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => setTypingState(false), 2500);
});

// -------------------------------------------------------------------------
// Pinned messages bar
// -------------------------------------------------------------------------
function renderPinnedBar(pinned){
  const bar = document.getElementById("pinned-bar");
  if (pinned.length === 0){
    bar.classList.remove("active");
    bar.innerHTML = "";
    return;
  }
  bar.classList.add("active");
  bar.innerHTML = pinned.map((p) =>
    `<div class="pinned-item" data-msgid="${p.id}">📌 <b style="color:var(--text)">${escapeHtml(p.name || "")}:</b> ${escapeHtml(p.text).slice(0, 60)}</div>`
  ).join("");
  bar.querySelectorAll(".pinned-item").forEach((item) => {
    item.addEventListener("click", () => {
      const target = document.getElementById("msg-" + item.dataset.msgid);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
}

// -------------------------------------------------------------------------
function applySearchFilter(){
  const q = searchQuery.trim().toLowerCase();
  document.querySelectorAll("#messages .msg").forEach((el) => {
    if (!q){ el.classList.remove("search-hidden"); return; }
    const match = el.textContent.toLowerCase().includes(q);
    el.classList.toggle("search-hidden", !match);
  });
}
function openSearch(){
  document.getElementById("search-bar").classList.add("active");
  document.getElementById("search-input").focus();
}
function closeSearch(){
  document.getElementById("search-bar").classList.remove("active");
  document.getElementById("search-input").value = "";
  searchQuery = "";
  applySearchFilter();
}
document.getElementById("search-toggle-desktop").addEventListener("click", openSearch);
document.getElementById("search-toggle-mobile").addEventListener("click", () => { closeSidebar(); openSearch(); });
document.getElementById("search-close").addEventListener("click", closeSearch);
document.getElementById("search-input").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applySearchFilter();
});

// -------------------------------------------------------------------------
// Message actions: react, edit, delete, pin — shown in a small popover
// -------------------------------------------------------------------------
function closePopover(){
  if (openPopoverEl){ openPopoverEl.remove(); openPopoverEl = null; }
  const bd = document.querySelector(".popover-backdrop");
  if (bd) bd.remove();
}

async function openMessagePopover(ev, msgId){
  closePopover();
  const msgRef = doc(db, "rooms", roomCode, "messages", msgId);
  const snap = await getDoc(msgRef);
  if (!snap.exists()) return;
  const m = snap.data();
  const mine = m.uid === uid;

  const backdrop = document.createElement("div");
  backdrop.className = "popover-backdrop";
  backdrop.addEventListener("click", closePopover);
  document.body.appendChild(backdrop);

  const pop = document.createElement("div");
  pop.className = "msg-popover";
  const rect = ev.target.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = Math.min(rect.left, window.innerWidth - 190);
  pop.style.top = top + "px";
  pop.style.left = Math.max(8, left) + "px";

  const emojiRow = document.createElement("div");
  emojiRow.className = "emoji-row";
  QUICK_REACTIONS.forEach((emoji) => {
    const b = document.createElement("button");
    b.textContent = emoji;
    b.addEventListener("click", () => { toggleReaction(msgId, emoji); closePopover(); });
    emojiRow.appendChild(b);
  });
  pop.appendChild(emojiRow);

  const pinBtn = document.createElement("button");
  pinBtn.className = "popover-action";
  pinBtn.textContent = m.pinned ? "Unpin message" : "Pin message";
  pinBtn.addEventListener("click", () => { updateDoc(msgRef, { pinned: !m.pinned }); closePopover(); });
  pop.appendChild(pinBtn);

  if (mine && !m.deleted){
    if (m.type === undefined || m.type === null){
      const editBtn = document.createElement("button");
      editBtn.className = "popover-action";
      editBtn.textContent = "Edit message";
      editBtn.addEventListener("click", () => { closePopover(); editMessage(msgId, m.text); });
      pop.appendChild(editBtn);
    }
    const delBtn = document.createElement("button");
    delBtn.className = "popover-action danger";
    delBtn.textContent = "Delete message";
    delBtn.addEventListener("click", () => { closePopover(); deleteMessage(msgId); });
    pop.appendChild(delBtn);
  }

  document.body.appendChild(pop);
  openPopoverEl = pop;
}

async function toggleReaction(msgId, emoji){
  const msgRef = doc(db, "rooms", roomCode, "messages", msgId);
  const snap = await getDoc(msgRef);
  if (!snap.exists()) return;
  const reactions = snap.data().reactions || {};
  if (reactions[uid] === emoji){
    await updateDoc(msgRef, { [`reactions.${uid}`]: deleteField() });
  } else {
    await updateDoc(msgRef, { [`reactions.${uid}`]: emoji });
  }
}

function editMessage(msgId, currentText){
  const next = window.prompt("Edit message:", currentText || "");
  if (next === null) return;
  const trimmed = next.trim();
  if (!trimmed || trimmed === currentText) return;
  updateDoc(doc(db, "rooms", roomCode, "messages", msgId), {
    text: trimmed, edited: true, editedAt: serverTimestamp()
  }).catch(() => {});
}

function deleteMessage(msgId){
  if (!window.confirm("Delete this message for everyone?")) return;
  updateDoc(doc(db, "rooms", roomCode, "messages", msgId), {
    deleted: true, text: "", imageData: deleteField(), audioData: deleteField(), fileData: deleteField()
  }).catch(() => {});
}

// -------------------------------------------------------------------------
// Photo sharing — images are compressed client-side and stored directly
// in the Firestore message document (no paid Storage/Blaze plan needed).
// Firestore caps a document at 256 KiB, so we keep the compressed photo
// comfortably under that.
// -------------------------------------------------------------------------
const photoBtn = document.getElementById("photo-btn");
const photoInput = document.getElementById("photo-input");
const photoStatus = document.getElementById("photo-status");

photoBtn.addEventListener("click", () => photoInput.click());

photoInput.addEventListener("change", async () => {
  const file = photoInput.files[0];
  photoInput.value = "";
  if (!file) return;

  photoStatus.textContent = "Preparing photo…";
  try {
    const dataUrl = await compressImage(file);
    photoStatus.textContent = "Sending photo…";
    await addDoc(collection(db, "rooms", roomCode, "messages"), {
      uid, name: myName, type: "image", imageData: dataUrl, createdAt: serverTimestamp(), ...dmFields()
    });
    photoStatus.textContent = "";
  } catch (e) {
    photoStatus.textContent = e.message || "Couldn't send that photo — try a smaller image.";
    setTimeout(() => { photoStatus.textContent = ""; }, 4000);
  }
});

// Resizes the image and re-encodes it as JPEG, shrinking quality/size
// until the base64 result comfortably fits inside a Firestore document.
function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That file doesn't look like an image."));
      img.onload = () => {
        const MAX_BASE64_CHARS = 180000; // leaves headroom under 256 KiB doc limit
        let maxSide = 900;
        let quality = 0.7;
        let dataUrl = renderToDataUrl(img, maxSide, quality);

        while (dataUrl.length > MAX_BASE64_CHARS && (maxSide > 300 || quality > 0.3)){
          if (quality > 0.3) quality -= 0.15;
          else maxSide -= 150;
          dataUrl = renderToDataUrl(img, maxSide, quality);
        }

        if (dataUrl.length > MAX_BASE64_CHARS){
          reject(new Error("That photo is too large even after compressing — try a smaller one."));
          return;
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// -------------------------------------------------------------------------
// File sharing — documents/PDFs/etc. Stored the same way as photos: base64
// directly in the Firestore message doc, so it stays comfortably under the
// 256 KiB document limit (roughly 180 KB original file size max).
// -------------------------------------------------------------------------
const fileBtn = document.getElementById("file-btn");
const fileInput = document.getElementById("file-input");
const MAX_FILE_BYTES = 180000; // ~180 KB, leaves headroom after base64 overhead

fileBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;

  if (file.size > MAX_FILE_BYTES){
    photoStatus.textContent = "That file is too big — keep it under ~175 KB.";
    setTimeout(() => { photoStatus.textContent = ""; }, 4000);
    return;
  }

  photoStatus.textContent = "Sending file…";
  try {
    const dataUrl = await blobToDataUrl(file);
    await addDoc(collection(db, "rooms", roomCode, "messages"), {
      uid, name: myName, type: "file",
      fileData: dataUrl, fileName: file.name, fileSize: file.size,
      createdAt: serverTimestamp(), ...dmFields()
    });
    photoStatus.textContent = "";
  } catch (e) {
    photoStatus.textContent = "Couldn't send that file.";
    setTimeout(() => { photoStatus.textContent = ""; }, 4000);
  }
});

// -------------------------------------------------------------------------
// Voice messages — tap mic to start recording, tap again to stop & send.
// Recorded audio is base64-encoded and stored directly in the message
// document, same approach as photos, with a duration cap to stay well
// under Firestore's per-document size limit.
// -------------------------------------------------------------------------
const micBtn = document.getElementById("mic-btn");
const recordingIndicator = document.getElementById("recording-indicator");
const recordingTimeEl = document.getElementById("recording-time");
const MAX_RECORDING_SECONDS = 120;

let mediaRecorder = null;
let recordedChunks = [];
let recordingStream = null;
let recordingStartTime = 0;
let recordingTimerInterval = null;

micBtn.addEventListener("click", async () => {
  if (mediaRecorder && mediaRecorder.state === "recording"){
    mediaRecorder.stop(); // onstop handler below sends the message
    return;
  }
  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e){
    photoStatus.textContent = "Microphone permission denied.";
    setTimeout(() => { photoStatus.textContent = ""; }, 3000);
    return;
  }

  recordedChunks = [];
  const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus"
    : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
  mediaRecorder = mimeType ? new MediaRecorder(recordingStream, { mimeType }) : new MediaRecorder(recordingStream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    clearInterval(recordingTimerInterval);
    recordingIndicator.classList.remove("active");
    micBtn.classList.remove("recording");
    recordingStream.getTracks().forEach((t) => t.stop());
    recordingStream = null;

    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
    if (blob.size < 500){
      // Recording was essentially instant (accidental tap) — don't send.
      return;
    }
    try {
      photoStatus.textContent = "Sending voice message…";
      const dataUrl = await blobToDataUrl(blob);
      if (dataUrl.length > 900000){
        photoStatus.textContent = "That voice message is too long — keep it under ~2 minutes.";
        setTimeout(() => { photoStatus.textContent = ""; }, 4000);
        return;
      }
      await addDoc(collection(db, "rooms", roomCode, "messages"), {
        uid, name: myName, type: "audio", audioData: dataUrl, createdAt: serverTimestamp(), ...dmFields()
      });
      photoStatus.textContent = "";
    } catch (e) {
      photoStatus.textContent = "Couldn't send that voice message.";
      setTimeout(() => { photoStatus.textContent = ""; }, 4000);
    }
  };

  mediaRecorder.start();
  micBtn.classList.add("recording");
  recordingIndicator.classList.add("active");
  recordingStartTime = Date.now();
  recordingTimeEl.textContent = "0:00";
  recordingTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
    const mm = Math.floor(elapsed / 60);
    const ss = String(elapsed % 60).padStart(2, "0");
    recordingTimeEl.textContent = `${mm}:${ss}`;
    if (elapsed >= MAX_RECORDING_SECONDS && mediaRecorder && mediaRecorder.state === "recording"){
      mediaRecorder.stop();
    }
  }, 250);
});

function blobToDataUrl(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read recording."));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

function renderToDataUrl(img, maxSide, quality){
  let { width, height } = img;
  if (width > height && width > maxSide){
    height = Math.round(height * (maxSide / width));
    width = maxSide;
  } else if (height > maxSide){
    width = Math.round(width * (maxSide / height));
    height = maxSide;
  }
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL("image/jpeg", quality);
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

// -------------------------------------------------------------------------
// Voice calls (WebRTC, 1-to-1, signaled through Firestore)
// -------------------------------------------------------------------------
function listenIncomingCalls(){
  const q = collection(db, "rooms", roomCode, "calls");
  unsubIncomingCalls = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      const call = change.doc.data();
      if (change.type === "added" && call.calleeUid === uid && call.status === "ringing" && !activeCallId){
        showIncomingCall(change.doc.id, call);
      }
    });
  });
}

async function startCall(calleeUid, calleeName){
  if (activeCallId) return;
  const callDoc = await addDoc(collection(db, "rooms", roomCode, "calls"), {
    callerUid: uid, callerName: myName,
    calleeUid, calleeName,
    status: "ringing", createdAt: serverTimestamp()
  });
  activeCallId = callDoc.id;
  openCallOverlay(calleeName, "Calling…", [
    { label: "End", cls: "call-end", onClick: () => endCall("cancelled") }
  ]);

  pc = new RTCPeerConnection(STUN_SERVERS);
  await attachLocalAudio();
  wireRemoteAudio();
  wireIceCandidates(callDoc.id, "callerCandidates");

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await updateDoc(doc(db, "rooms", roomCode, "calls", callDoc.id), {
    offer: { type: offer.type, sdp: offer.sdp }
  });

  unsubCallDoc = onSnapshot(doc(db, "rooms", roomCode, "calls", callDoc.id), async (d) => {
    const data = d.data();
    if (!data) return;
    if (data.status === "declined"){ cleanupCall("Call declined"); return; }
    if (data.status === "ended"){ cleanupCall("Call ended"); return; }
    if (data.answer && pc && !pc.currentRemoteDescription){
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById("call-status").textContent = "Connected";
    }
  });
  listenRemoteCandidates(callDoc.id, "calleeCandidates");
}

function showIncomingCall(callId, call){
  activeCallId = callId;
  openCallOverlay(call.callerName, "Incoming call…", [
    { label: "Decline", cls: "call-decline", onClick: () => declineCall(callId) },
    { label: "Accept", cls: "call-accept", onClick: () => acceptCall(callId, call) }
  ]);
}

async function acceptCall(callId, call){
  document.getElementById("call-status").textContent = "Connecting…";
  pc = new RTCPeerConnection(STUN_SERVERS);
  await attachLocalAudio();
  wireRemoteAudio();
  wireIceCandidates(callId, "calleeCandidates");

  await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(doc(db, "rooms", roomCode, "calls", callId), {
    answer: { type: answer.type, sdp: answer.sdp },
    status: "connected"
  });
  document.getElementById("call-status").textContent = "Connected";
  document.getElementById("call-actions").innerHTML = "";
  const endBtn = document.createElement("button");
  endBtn.className = "call-end"; endBtn.textContent = "End";
  endBtn.onclick = () => endCall("ended");
  document.getElementById("call-actions").appendChild(endBtn);

  listenRemoteCandidates(callId, "callerCandidates");

  unsubCallDoc = onSnapshot(doc(db, "rooms", roomCode, "calls", callId), (d) => {
    const data = d.data();
    if (data && data.status === "ended") cleanupCall("Call ended");
  });
}

async function declineCall(callId){
  await updateDoc(doc(db, "rooms", roomCode, "calls", callId), { status: "declined" });
  cleanupCall("Call declined");
}

async function endCall(reason){
  if (activeCallId){
    updateDoc(doc(db, "rooms", roomCode, "calls", activeCallId), { status: "ended" }).catch(()=>{});
  }
  cleanupCall(reason === "cancelled" ? "Call cancelled" : "Call ended");
}

function cleanupCall(){
  if (pc){ pc.close(); pc = null; }
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (unsubCallDoc){ unsubCallDoc(); unsubCallDoc = null; }
  if (unsubIceCandidates){ unsubIceCandidates(); unsubIceCandidates = null; }
  activeCallId = null;
  closeCallOverlay();
}

async function attachLocalAudio(){
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e){
    document.getElementById("call-status").textContent = "Microphone permission denied";
    throw e;
  }
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

function wireRemoteAudio(){
  const audioEl = document.getElementById("remote-audio");
  const remoteStream = new MediaStream();
  audioEl.srcObject = remoteStream;
  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
  };
}

function wireIceCandidates(callId, subcollectionName){
  pc.onicecandidate = (event) => {
    if (event.candidate){
      addDoc(collection(db, "rooms", roomCode, "calls", callId, subcollectionName), event.candidate.toJSON());
    }
  };
}

function listenRemoteCandidates(callId, subcollectionName){
  unsubIceCandidates = onSnapshot(collection(db, "rooms", roomCode, "calls", callId, subcollectionName), (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added" && pc){
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(()=>{});
      }
    });
  });
}

function openCallOverlay(name, status, actions){
  document.getElementById("call-overlay").classList.add("active");
  document.getElementById("call-avatar").textContent = (name || "?").charAt(0).toUpperCase();
  document.getElementById("call-name").textContent = name;
  document.getElementById("call-status").textContent = status;
  const actionsEl = document.getElementById("call-actions");
  actionsEl.innerHTML = "";
  actions.forEach(a => {
    const btn = document.createElement("button");
    btn.className = a.cls;
    btn.textContent = a.label;
    btn.onclick = a.onClick;
    actionsEl.appendChild(btn);
  });
}

function closeCallOverlay(){
  document.getElementById("call-overlay").classList.remove("active");
}

// Register service worker so this site can be installed as an app (PWA).
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
